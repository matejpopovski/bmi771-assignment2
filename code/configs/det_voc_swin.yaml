output_folder: ../logs
seed: 771
dataset:
  img_folder: ../data/VOCdevkit/VOC2007/JPEGImages
  json_folder: ../data
loader:
  batch_size: 8
  num_workers: 2
model:
  backbone: swin_t
  fpn_feats_dim: 128
  backbone_out_feats_dims:
  - 192
  - 384
  - 768
opt:
  type: AdamW
  learning_rate: 0.0001
  weight_decay: 0.05
  epochs: 6
  warmup_epochs: 1
