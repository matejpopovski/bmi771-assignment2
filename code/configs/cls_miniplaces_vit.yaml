model_type: VIT
loader:
  batch_size: 256
  num_workers: 4
model:
  patch_size: 8
  embed_dim: 192
  depth: 6
  num_heads: 4
  window_size: 4
  window_block_indexes:
  - 0
  - 1
  - 3
  - 4
  drop_path_rate: 0.1
opt:
  type: AdamW
  epochs: 40
  weight_decay: 0.05
  learning_rate: 0.001
output_folder: ../logs
dataset:
  root_folder: ../data
seed: 771
