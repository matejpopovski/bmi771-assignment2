output_folder: ../logs
loader:
  batch_size: 32
  num_workers: 2
dataset:
  img_folder: ../data/VOCdevkit/VOC2007/JPEGImages
  json_folder: ../data
  name: VOC2007
  train: trainval
  test: test
input:
  img_min_size: &id001
  - 288
  - 320
  - 352
  - 384
  - 416
  - 448
  - 480
  img_max_size: 640
  img_mean: &id002
  - 0.485
  - 0.456
  - 0.406
  img_std: &id003
  - 0.229
  - 0.224
  - 0.225
model:
  fpn_feats_dim: 128
  backbone_freeze_bn: false
  backbone: resnet18
  backbone_out_feats:
  - layer2
  - layer3
  - layer4
  backbone_out_feats_dims:
  - 128
  - 256
  - 512
  fpn_strides:
  - 8
  - 16
  - 32
  - 64
  - 128
  num_classes: 20
  regression_range:
  - - 0
    - 64
  - - 64
    - 128
  - - 128
    - 256
  - - 256
    - 512
  - - 512
    - 1000
  img_min_size: *id001
  img_max_size: 640
  img_mean: *id002
  img_std: *id003
  train_cfg: &id004
    center_sampling_radius: 1.5
  test_cfg: &id005
    score_thresh: 0.1
    nms_thresh: 0.6
    detections_per_img: 100
    topk_candidates: 1000
opt:
  warmup_epochs: 3
  epochs: 12
  learning_rate: 0.02
  type: SGD
  momentum: 0.9
  weight_decay: 0.0001
  warmup: true
  schedule_type: cosine
  schedule_steps: []
  schedule_gamma: 0.1
seed: 771
devices:
- cuda:0
dtype: fp16
model_name: FCOS
train_cfg: *id004
test_cfg: *id005
